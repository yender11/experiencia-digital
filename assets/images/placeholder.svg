<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080B12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#101D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080B12;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(165, 173, 186, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Fondo -->
  <rect width="1920" height="1080" fill="url(#grad)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Borde decorativo -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="rgba(201, 185, 155, 0.2)" stroke-width="2" rx="10"/>
  
  <!-- Icono de imagen -->
  <g transform="translate(960, 450)">
    <rect x="-80" y="-60" width="160" height="120" fill="none" stroke="rgba(165, 173, 186, 0.3)" stroke-width="2" rx="8"/>
    <circle cx="-30" cy="-20" r="15" fill="none" stroke="rgba(165, 173, 186, 0.3)" stroke-width="2"/>
    <path d="M -70 40 L -30 0 L 10 40 L 50 10 L 70 40" fill="none" stroke="rgba(165, 173, 186, 0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Texto principal -->
  <text x="50%" y="600" font-family="Georgia, 'Playfair Display', serif" font-size="32" fill="#A5ADBA" text-anchor="middle" letter-spacing="2">
    REEMPLAZAR CON TU FOTOGRAFÍA
  </text>
  
  <!-- Texto secundario -->
  <text x="50%" y="650" font-family="Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">
    Coloca tus imágenes en la carpeta assets/images/
  </text>
  
  <!-- Decoración dorada -->
  <line x1="860" y1="700" x2="1060" y2="700" stroke="#C9B99B" stroke-width="1" opacity="0.5"/>
</svg>
